<svg viewBox="0 0 1000 1860" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1860" fill="#ffffff"/>

  <!-- Début -->
  <rect x="370" y="20" width="260" height="70" rx="35" fill="#e6e2d8" stroke="#8c8672" stroke-width="1.5"/>
  <text x="500" y="62" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Début</text>
  <line x1="500" y1="90" x2="500" y2="120" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Divider: Initialisation -->
  <rect x="90" y="120" width="820" height="40" rx="6" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="500" y="145" text-anchor="middle" font-size="14" fill="#888">— Initialisation (exécutée une seule fois) —</text>
  <line x1="500" y1="160" x2="500" y2="185" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Init box 1 -->
  <rect x="270" y="185" width="460" height="75" rx="10" fill="#d7f2e6" stroke="#2f9e6b" stroke-width="1.5"/>
  <text x="500" y="215" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f6b4d">Initialiser LCD (16×2)</text>
  <text x="500" y="238" text-anchor="middle" font-size="13" fill="#1f6b4d">et liaison série 9600 bauds</text>
  <line x1="500" y1="260" x2="500" y2="285" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Init box 2 -->
  <rect x="270" y="285" width="460" height="75" rx="10" fill="#d7f2e6" stroke="#2f9e6b" stroke-width="1.5"/>
  <text x="500" y="315" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f6b4d">Configurer A0–A4 en entrée</text>
  <text x="500" y="338" text-anchor="middle" font-size="13" fill="#1f6b4d">5 broches analogiques</text>
  <line x1="500" y1="360" x2="500" y2="385" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Init box 3 -->
  <rect x="270" y="385" width="460" height="75" rx="10" fill="#d7f2e6" stroke="#2f9e6b" stroke-width="1.5"/>
  <text x="500" y="415" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f6b4d">valeurRef ← LireAnalogique(A0)</text>
  <text x="500" y="438" text-anchor="middle" font-size="13" fill="#1f6b4d">phototransistor de référence (couvert)</text>
  <line x1="500" y1="460" x2="500" y2="490" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Divider: Boucle principale -->
  <rect x="90" y="490" width="820" height="40" rx="6" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="500" y="515" text-anchor="middle" font-size="14" fill="#888">— Boucle principale (répétée indéfiniment) —</text>

  <!-- Loop entry arrow marker point (for return loop) -->
  <line x1="500" y1="530" x2="500" y2="555" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Loop box: Lire valeurs -->
  <rect x="270" y="555" width="460" height="75" rx="10" fill="#dbeeff" stroke="#2f80c9" stroke-width="1.5"/>
  <text x="500" y="585" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d5c94">Lire valeur1, valeur2, valeur3, valeur4</text>
  <text x="500" y="608" text-anchor="middle" font-size="13" fill="#1d5c94">analogRead(A1…A4)</text>
  <line x1="500" y1="630" x2="500" y2="655" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Loop box: Envoyer valeurs brutes -->
  <rect x="270" y="655" width="460" height="75" rx="10" fill="#dbeeff" stroke="#2f80c9" stroke-width="1.5"/>
  <text x="500" y="685" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d5c94">Envoyer valeurs brutes</text>
  <text x="500" y="708" text-anchor="middle" font-size="13" fill="#1d5c94">vers moniteur série (débogage)</text>
  <line x1="500" y1="730" x2="500" y2="748" stroke="#333" stroke-width="1.5"/>
  <text x="500" y="745" text-anchor="middle" font-size="12" fill="#999">seuil = valeurRef + 25</text>
  <line x1="500" y1="750" x2="500" y2="765" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ Decision block generator (b1..b4) ============ -->
  <!-- Diamond 1 : centered y=855, boxes y 815-895 -->
  <polygon points="500,765 700,855 500,945 300,855" fill="#fff3d6" stroke="#e0a020" stroke-width="1.5"/>
  <text x="500" y="860" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5a00">valeur1 &lt; seuil ?</text>

  <rect x="70" y="815" width="150" height="80" rx="8" fill="#f9dede" stroke="#c0504d" stroke-width="1.5"/>
  <text x="145" y="861" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a3230">b1 ← 1</text>
  <line x1="300" y1="855" x2="220" y2="855" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="845" text-anchor="middle" font-size="12" fill="#666">oui</text>

  <rect x="780" y="815" width="150" height="80" rx="8" fill="#ececec" stroke="#888" stroke-width="1.5"/>
  <text x="855" y="861" text-anchor="middle" font-size="16" font-weight="bold" fill="#555">b1 ← 0</text>
  <line x1="700" y1="855" x2="780" y2="855" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="740" y="845" text-anchor="middle" font-size="12" fill="#666">non</text>

  <!-- merge 1 -->
  <line x1="145" y1="895" x2="145" y2="965" stroke="#999" stroke-width="1.5"/>
  <line x1="855" y1="895" x2="855" y2="965" stroke="#999" stroke-width="1.5"/>
  <line x1="145" y1="965" x2="855" y2="965" stroke="#999" stroke-width="1.5"/>
  <line x1="500" y1="945" x2="500" y2="965" stroke="#999" stroke-width="1.5"/>
  <line x1="500" y1="965" x2="500" y2="990" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Diamond 2 : centered y=1085 -->
  <polygon points="500,990 700,1085 500,1180 300,1085" fill="#fff3d6" stroke="#e0a020" stroke-width="1.5"/>
  <text x="500" y="1090" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5a00">valeur2 &lt; seuil ?</text>

  <rect x="70" y="1045" width="150" height="80" rx="8" fill="#f9dede" stroke="#c0504d" stroke-width="1.5"/>
  <text x="145" y="1091" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a3230">b2 ← 1</text>
  <line x1="300" y1="1085" x2="220" y2="1085" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="1075" text-anchor="middle" font-size="12" fill="#666">oui</text>

  <rect x="780" y="1045" width="150" height="80" rx="8" fill="#ececec" stroke="#888" stroke-width="1.5"/>
  <text x="855" y="1091" text-anchor="middle" font-size="16" font-weight="bold" fill="#555">b2 ← 0</text>
  <line x1="700" y1="1085" x2="780" y2="1085" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="740" y="1075" text-anchor="middle" font-size="12" fill="#666">non</text>

  <!-- merge 2 -->
  <line x1="145" y1="1125" x2="145" y2="1195" stroke="#999" stroke-width="1.5"/>
  <line x1="855" y1="1125" x2="855" y2="1195" stroke="#999" stroke-width="1.5"/>
  <line x1="145" y1="1195" x2="855" y2="1195" stroke="#999" stroke-width="1.5"/>
  <line x1="500" y1="1180" x2="500" y2="1195" stroke="#999" stroke-width="1.5"/>
  <line x1="500" y1="1195" x2="500" y2="1220" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Diamond 3 : centered y=1315 -->
  <polygon points="500,1220 700,1315 500,1410 300,1315" fill="#fff3d6" stroke="#e0a020" stroke-width="1.5"/>
  <text x="500" y="1320" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5a00">valeur3 &lt; seuil ?</text>

  <rect x="70" y="1275" width="150" height="80" rx="8" fill="#f9dede" stroke="#c0504d" stroke-width="1.5"/>
  <text x="145" y="1321" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a3230">b3 ← 1</text>
  <line x1="300" y1="1315" x2="220" y2="1315" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="1305" text-anchor="middle" font-size="12" fill="#666">oui</text>

  <rect x="780" y="1275" width="150" height="80" rx="8" fill="#ececec" stroke="#888" stroke-width="1.5"/>
  <text x="855" y="1321" text-anchor="middle" font-size="16" font-weight="bold" fill="#555">b3 ← 0</text>
  <line x1="700" y1="1315" x2="780" y2="1315" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="740" y="1305" text-anchor="middle" font-size="12" fill="#666">non</text>

  <!-- merge 3 -->
  <line x1="145" y1="1355" x2="145" y2="1425" stroke="#999" stroke-width="1.5"/>
  <line x1="855" y1="1355" x2="855" y2="1425" stroke="#999" stroke-width="1.5"/>
  <line x1="145" y1="1425" x2="855" y2="1425" stroke="#999" stroke-width="1.5"/>
  <line x1="500" y1="1410" x2="500" y2="1425" stroke="#999" stroke-width="1.5"/>
  <line x1="500" y1="1425" x2="500" y2="1450" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Diamond 4 : centered y=1545 -->
  <polygon points="500,1450 700,1545 500,1640 300,1545" fill="#fff3d6" stroke="#e0a020" stroke-width="1.5"/>
  <text x="500" y="1550" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5a00">valeur4 &lt; seuil ?</text>

  <rect x="70" y="1505" width="150" height="80" rx="8" fill="#f9dede" stroke="#c0504d" stroke-width="1.5"/>
  <text x="145" y="1551" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a3230">b4 ← 1</text>
  <line x1="300" y1="1545" x2="220" y2="1545" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="1535" text-anchor="middle" font-size="12" fill="#666">oui</text>

  <rect x="780" y="1505" width="150" height="80" rx="8" fill="#ececec" stroke="#888" stroke-width="1.5"/>
  <text x="855" y="1551" text-anchor="middle" font-size="16" font-weight="bold" fill="#555">b4 ← 0</text>
  <line x1="700" y1="1545" x2="780" y2="1545" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="740" y="1535" text-anchor="middle" font-size="12" fill="#666">non</text>

  <!-- merge 4 -->
  <line x1="145" y1="1585" x2="145" y2="1655" stroke="#999" stroke-width="1.5"/>
  <line x1="855" y1="1585" x2="855" y2="1655" stroke="#999" stroke-width="1.5"/>
  <line x1="145" y1="1655" x2="855" y2="1655" stroke="#999" stroke-width="1.5"/>
  <line x1="500" y1="1640" x2="500" y2="1655" stroke="#999" stroke-width="1.5"/>
  <line x1="500" y1="1655" x2="500" y2="1680" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- indice box -->
  <rect x="230" y="1680" width="540" height="75" rx="10" fill="#ece6f7" stroke="#7b5ea7" stroke-width="1.5"/>
  <text x="500" y="1710" text-anchor="middle" font-size="16" font-weight="bold" fill="#523b74">indice ← b1×8 + b2×4 + b3×2 + b4×1</text>
  <text x="500" y="1733" text-anchor="middle" font-size="13" fill="#523b74">conversion mot Gray → entier (0–15)</text>
  <line x1="500" y1="1755" x2="500" y2="1775" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- afficher box -->
  <rect x="270" y="1775" width="460" height="75" rx="10" fill="#dbeeff" stroke="#2f80c9" stroke-width="1.5"/>
  <text x="500" y="1805" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d5c94">Afficher tab[indice]</text>
  <text x="500" y="1828" text-anchor="middle" font-size="13" fill="#1d5c94">sur moniteur série et sur écran LCD</text>

  <!-- Return loop -->
  <line x1="500" y1="1850" x2="500" y2="1858" stroke="#333" stroke-width="1.5"/>
  <path d="M 500,1858 L 30,1858 L 30,592 L 268,592" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="18" y="1230" text-anchor="middle" font-size="12" fill="#888" transform="rotate(-90 18 1230)">retour boucle</text>

</svg>
